<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b4770">
  <meta name="description" content="Undangan Pernikahan Ade & Ros">
  <title>Undangan — Ade & Ros</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app" id="app">

    <div class="book-wrap">

      <div
        class="book"
        id="book"
        role="button"
        tabindex="0"
        aria-label="Buka undangan"
        aria-live="polite"
      >

        <div class="page-shadow"></div>

        <img
          id="pageImage"
          class="page-image"
          src="assets/luar_depan.webp"
          alt="Undangan Ade dan Ros"
        >

        <div
          id="recipient"
          class="recipient"
          aria-hidden="true"
        ></div>

        <div
          id="hint"
          class="hint"
        >
          Ketuk untuk membuka
        </div>

      </div>

    </div>

    <div class="bottom">
      <span id="stepText">1 / 4</span>
    </div>

  </main>

  <script src="script.js"></script>

</body>
</html>
